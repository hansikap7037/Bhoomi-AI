<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BhoomiAI — Land to Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {},
        },
      };
    </script>
    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const app = document.getElementById("app");

      const state = {
        screen: "landing",
        showAuth: false,
        authMode: "login",
        role: "consumer",
        active: "Overview",
        image: null,
        analyzing: false,
        analyzed: false,
        generating: false,
        generated: false,
        selectedDesign: 0,
        formData: {
          name: "",
          contact: "",
          location: "",
          experience: "",
          email: "",
          password: "",
        },
        authError: "",
        currentUser: null,
        siteData: {
          location: "Haridwar, Uttarakhand",
          length: "60",
          width: "40",
          direction: "North",
          road: "East",
          slope: "Mostly Flat",
          vegetation: "Moderate",
        },
        requirements: {
          floors: "2 Floors",
          bedrooms: "3 Bedrooms",
          bathrooms: "3 Bathrooms",
          kitchen: "Open Kitchen",
          parking: "1 Car",
          balcony: "Yes",
          garden: "Yes",
          vastu: "Vastu Preferred",
          style: "Modern",
          budget: "₹40–50 Lakhs",
          family: "4–5 Members",
          special: "",
        },
      };
      state.projects = JSON.parse(
        localStorage.getItem("bhoomiai_projects") || "[]",
      );
      state.costRate = 1800;

      function openProject(id) {
        const p = state.projects.find((x) => x.id === id);
        if (!p) return;
        state.siteData = { ...p.siteData };
        state.requirements = { ...p.requirements };
        state.analyzed = true;
        state.active = "Land Analysis";
        render();
      }

      function saveProject() {
        const project = {
          id: Date.now(),
          name: state.siteData.location + " Home",
          savedAt: new Date().toLocaleString(),
          siteData: { ...state.siteData },
          requirements: { ...state.requirements },
          area: plotArea(),
          builtUp: builtUpArea(),
        };
        state.projects = [
          project,
          ...state.projects.filter((p) => p.name !== project.name),
        ].slice(0, 20);
        localStorage.setItem(
          "bhoomiai_projects",
          JSON.stringify(state.projects),
        );
        return project;
      }

      function plotArea() {
        const l = Number(state.siteData.length),
          w = Number(state.siteData.width);
        return Number.isFinite(l) && Number.isFinite(w) && l > 0 && w > 0
          ? l * w
          : 0;
      }

      function floorsCount() {
        const m = String(state.requirements.floors).match(/\d+/);
        return m ? Number(m[0]) : 1;
      }

      function builtUpArea() {
        return Math.round(plotArea() * 0.65 * floorsCount());
      }

      function money(n) {
        return "₹" + Math.round(n).toLocaleString("en-IN");
      }

      function downloadReport() {
        const area = plotArea(),
          built = builtUpArea(),
          rate = Number(state.costRate) || 1800;
        const report = `BHOOMIAI — PRELIMINARY PROJECT REPORT\nGenerated: ${new Date().toLocaleString()}\n\nSITE DETAILS\nLocation: ${state.siteData.location}\nPlot dimensions: ${state.siteData.length} ft × ${state.siteData.width} ft\nPlot area: ${area.toLocaleString()} sq.ft\nRoad access: ${state.siteData.road}\nOrientation: ${state.siteData.direction}\nTerrain: ${state.siteData.slope}\nVegetation: ${state.siteData.vegetation}\n\nHOUSE REQUIREMENTS\n${Object.entries(
          state.requirements,
        )
          .map(([k, v]) => k + ": " + v)
          .join(
            "\n",
          )}\n\nPRELIMINARY COST MODEL\nAssumed built-up area: ${built.toLocaleString()} sq.ft (65% plot coverage per floor × ${floorsCount()} floor(s))\nAssumed rate: ${money(rate)} per sq.ft\nIndicative base cost: ${money(built * rate)}\nIllustrative range (±15%): ${money(built * rate * 0.85)} – ${money(built * rate * 1.15)}\n\nLIMITATIONS\nThis report is a prototype planning aid. Site suitability, climate, legal setbacks, structural design, permits, and local rates have not been independently verified. Cost figures are illustrative only and are not a construction quotation. Consult licensed local professionals before building.`;
        const blob = new Blob([report], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "BhoomiAI-project-report.txt";
        a.click();
        URL.revokeObjectURL(url);
      }
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (m) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[m],
        );

      function setState(p) {
        Object.assign(state, p);
        render();
      }

      function openSignup() {
        state.authError = "";
        state.formData.password = "";
        setState({ authMode: "signup", showAuth: true });
      }

      function openLogin() {
        state.authError = "";
        state.formData.password = "";
        setState({ authMode: "login", showAuth: true });
      }

      function logout() {
        setState({ screen: "landing", showAuth: false });
      }

      function authSubmit(e) {
        e.preventDefault();
        const email = String(state.formData.email || "")
          .trim()
          .toLowerCase();
        const password = String(state.formData.password || "");
        state.authError = "";
        if (!email || !password) {
          state.authError = "Please enter both email and password.";
          render();
          return;
        }
        let users = [];
        try {
          users = JSON.parse(
            localStorage.getItem("bhoomiai_demo_users") || "[]",
          );
          if (!Array.isArray(users)) users = [];
        } catch (_) {
          users = [];
        }
        if (state.authMode === "signup") {
          if (password.length < 6) {
            state.authError = "Password must be at least 6 characters.";
            render();
            return;
          }
          if (users.some((u) => u.email === email)) {
            state.authError =
              "An account with this email already exists. Please log in.";
            render();
            return;
          }
          const user = {
            email,
            password,
            role: state.role,
            name: String(state.formData.name || "").trim(),
            contact: String(state.formData.contact || "").trim(),
            location: String(state.formData.location || "").trim(),
            experience: String(state.formData.experience || "").trim(),
          };
          users.push(user);
          localStorage.setItem("bhoomiai_demo_users", JSON.stringify(users));
          state.currentUser = user;
        } else {
          const user = users.find((u) => u.email === email);
          if (!user) {
            state.authError =
              "No account found for this email. Please sign up first.";
            render();
            return;
          }
          if (user.password !== password) {
            state.authError = "Incorrect password. Please try again.";
            render();
            return;
          }
          state.currentUser = user;
          state.role = user.role || "consumer";
          state.formData.name = user.name || "";
          state.formData.contact = user.contact || "";
          state.formData.location = user.location || "";
          state.formData.experience = user.experience || "";
        }
        state.authError = "";
        setState({
          showAuth: false,
          screen:
            (state.currentUser.role || state.role) === "consumer"
              ? "dashboard"
              : "seller",
        });
      }

      function icon(item) {
        return (
          {
            Overview: "⌂",
            "My Projects": "▣",
            "Land Analysis": "◎",
            "House Designs": "⌂",
            "3D Studio": "◇",
            Materials: "▤",
            "Cost Estimate": "₹",
            Profile: "○",
          }[item] || "•"
        );
      }

      function stat(n, l) {
        return `<div><div class="text-2xl font-bold">${n}</div><div class="mt-1 text-xs text-[#718078]">${l}</div></div>`;
      }

      function mini(l, v) {
        return `<div class="rounded-xl bg-white/70 p-3"><div class="text-[10px] uppercase tracking-wider text-[#738078]">${l}</div><div class="mt-1 text-sm font-bold">${v}</div></div>`;
      }

      function feature(i, t, x) {
        return `<div class="rounded-3xl border border-white/10 bg-white/5 p-6"><div class="flex h-11 w-11 items-center justify-center rounded-xl bg-white/10 text-xl">${i}</div><div class="mt-5 text-lg font-bold">${t}</div><div class="mt-2 text-sm leading-6 text-[#b5c8bd]">${x}</div></div>`;
      }

      function step(n, t, x) {
        return `<div class="rounded-3xl border border-[#dce3da] bg-white p-6 shadow-sm"><div class="text-sm font-bold text-[#4d795b]">${n}</div><div class="mt-4 text-lg font-bold">${t}</div><div class="mt-2 text-sm leading-6 text-[#758179]">${x}</div></div>`;
      }

      function dashPreview(t, v, s) {
        return `<div class="rounded-2xl border border-[#e2e7e1] p-4"><div class="text-xs text-[#77847d]">${t}</div><div class="mt-2 text-2xl font-bold">${v}<span class="ml-1 text-xs font-semibold text-[#77847d]">${s}</span></div></div>`;
      }

      function dashStat(t, v, s, i) {
        return `<div class="rounded-2xl border border-[#dfe5dd] bg-white p-5 shadow-sm"><div class="flex items-center justify-between"><div><div class="text-xs text-[#7b877f]">${t}</div><div class="mt-2 text-2xl font-bold">${v}<span class="ml-1 text-xs text-[#7b877f]">${s}</span></div></div><div class="flex h-10 w-10 items-center justify-center rounded-xl bg-[#edf3eb] text-[#31543e]">${i}</div></div></div>`;
      }

      function progress(l, v) {
        return `<div><div class="flex justify-between text-xs font-semibold"><span>${l}</span><span>${v}%</span></div><div class="mt-2 h-2 rounded-full bg-[#e8eee6]"><div class="h-full rounded-full bg-[#6e9277]" style="width:${v}%"></div></div></div>`;
      }

      function quick(i, t, x, fn) {
        return `<button onclick="${fn}" class="flex w-full items-center gap-4 rounded-2xl border border-[#e2e7e1] p-4 text-left hover:bg-[#f5f7f3]"><span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-[#edf3eb] text-[#31543e]">${i}</span><span><span class="block text-sm font-bold">${t}</span><span class="mt-1 block text-xs text-[#77847d]">${x}</span></span><span class="ml-auto text-[#7b877f]">→</span></button>`;
      }

      function activity(n, t, x) {
        return `<div class="rounded-2xl border border-[#e2e7e1] p-4"><div class="text-xs font-bold text-[#718078]">${n}</div><div class="mt-2 font-bold">${t}</div><div class="mt-1 text-xs text-[#77847d]">${x}</div></div>`;
      }

      function landing() {
        return `<main class="min-h-screen bg-[#f6f7f2] text-[#14251d]"><nav class="border-b border-[#dfe5dc] bg-[#f6f7f2]/95"><div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-5"><div class="flex items-center gap-3"><div class="flex h-10 w-10 items-center justify-center rounded-xl bg-[#163d2b] text-xl text-white">◈</div><div><div class="text-xl font-bold tracking-tight">BhoomiAI</div><div class="text-[10px] uppercase tracking-[0.25em] text-[#718078]">Land to Home</div></div></div><div class="hidden items-center gap-8 text-sm text-[#5f6e65] md:flex"><a href="#features">Features</a><a href="#how">How it works</a><a href="#solutions">Solutions</a><a href="#about">About</a></div><div class="flex items-center gap-3"><button onclick="openLogin()" class="hidden rounded-full px-4 py-2 text-sm font-medium text-[#163d2b] hover:bg-[#e8eee7] sm:block">Login</button><button onclick="openSignup()" class="rounded-full bg-[#163d2b] px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-[#0f2d20]">Start Designing</button></div></div></nav>
<section class="mx-auto grid max-w-7xl items-center gap-14 px-6 py-20 lg:grid-cols-2 lg:py-28"><div><div class="mb-6 inline-flex items-center gap-2 rounded-full border border-[#cbd8cb] bg-[#edf3ec] px-4 py-2 text-xs font-semibold text-[#31533f]"><span class="h-2 w-2 rounded-full bg-[#4f8a63]"></span>AI-powered architectural intelligence</div><h1 class="max-w-2xl text-5xl font-bold leading-[1.05] tracking-tight md:text-7xl">Turn your land into your<span class="text-[#4d795b]"> dream home.</span></h1><p class="mt-7 max-w-xl text-lg leading-8 text-[#66736c]">BhoomiAI transforms a simple piece of land into a complete intelligent home plan — from climate analysis and Vastu-aware orientation to 3D visualization, materials and cost estimation.</p><div class="mt-9 flex flex-wrap gap-4"><button onclick="openSignup()" class="rounded-full bg-[#163d2b] px-7 py-4 text-sm font-bold text-white shadow-lg transition hover:-translate-y-0.5 hover:bg-[#0f2d20]">Start with your land →</button><a href="#how" class="rounded-full border border-[#cfd8d0] bg-white px-7 py-4 text-sm font-semibold text-[#254334]">See how it works</a></div><div class="mt-12 grid max-w-lg grid-cols-3 gap-6">${stat("AI", "Land Analysis")}${stat("3D", "Home Visualization")}${stat("360°", "Design Control")}</div></div>
<div class="relative"><div class="absolute -inset-10 rounded-full bg-[#dce9dc] blur-3xl"></div><div class="relative overflow-hidden rounded-[32px] border border-[#d9e0d8] bg-white p-4 shadow-2xl"><div class="rounded-[25px] bg-[#dfe9dd] p-5"><div class="mb-4 flex items-center justify-between"><div><div class="text-xs font-semibold uppercase tracking-[0.18em] text-[#65776b]">AI Analysis</div><div class="mt-1 text-lg font-bold">Your land, understood.</div></div><div class="rounded-full bg-white px-3 py-1.5 text-xs font-bold text-[#39704f]">94% Match</div></div><div class="relative h-[390px] overflow-hidden rounded-[22px] bg-[#c6d9bf]"><div class="absolute inset-0 opacity-40"><div class="h-full w-full" style="background-image:linear-gradient(30deg,transparent 48%,rgba(255,255,255,.5) 49%,transparent 50%),linear-gradient(120deg,transparent 48%,rgba(255,255,255,.4) 49%,transparent 50%);background-size:80px 80px"></div></div><div class="absolute bottom-12 left-10 right-10 h-44 rotate-[-5deg] rounded-[12px] border-2 border-dashed border-[#3f6749] bg-[#b5cfaa]/70"></div><div class="absolute bottom-20 left-1/2 w-48 -translate-x-1/2"><div class="relative mx-auto h-24 w-40 rounded-sm bg-[#f4f0e7] shadow-xl"><div class="absolute -top-14 left-[-10px] h-0 w-0 border-l-[90px] border-r-[90px] border-b-[70px] border-l-transparent border-r-transparent border-b-[#7c987e]"></div><div class="absolute left-7 top-8 h-10 w-7 rounded-sm bg-[#7e9eae]"></div><div class="absolute right-7 top-8 h-10 w-7 rounded-sm bg-[#7e9eae]"></div><div class="absolute bottom-0 left-1/2 h-14 w-9 -translate-x-1/2 bg-[#795d48]"></div></div></div><div class="absolute left-4 top-4 rounded-xl bg-white/90 px-3 py-2 shadow-lg backdrop-blur"><div class="text-[10px] uppercase tracking-wider text-[#738078]">Plot</div><div class="font-bold">2,400 sq.ft</div></div><div class="absolute bottom-4 right-4 rounded-xl bg-[#163d2b]/95 px-4 py-3 text-white shadow-lg"><div class="text-[10px] uppercase tracking-wider text-[#a8c2b1]">Location</div><div class="text-sm font-semibold">Haridwar, Uttarakhand</div></div></div><div class="mt-4 grid grid-cols-3 gap-3">${mini("Climate", "28°C")}${mini("Humidity", "68%")}${mini("Wind", "14 km/h")}</div></div></div></div></section>
<section id="features" class="bg-[#123526] px-6 py-24 text-white"><div class="mx-auto max-w-7xl"><div class="max-w-2xl"><div class="text-xs font-bold uppercase tracking-[0.25em] text-[#9bbca5]">Everything connected</div><h2 class="mt-4 text-4xl font-bold tracking-tight md:text-5xl">From empty plot to<span class="text-[#a8c99f]"> intelligent home.</span></h2><p class="mt-5 leading-7 text-[#b5c8bd]">BhoomiAI combines architectural planning, environmental intelligence and construction insights in one platform.</p></div><div class="mt-14 grid gap-5 md:grid-cols-2 lg:grid-cols-3">${feature("☀", "Climate Intelligence", "Understand temperature, rainfall, humidity, wind and sunlight before designing your home.")}${feature("⌖", "Direction & Vastu", "Optimize orientation, entrances, rooms and sunlight using direction-aware planning.")}${feature("▦", "AI Floor Plan", "Generate intelligent floor plans based on your family, plot size and lifestyle.")}${feature("◇", "3D House", "Explore your future home in an interactive three-dimensional environment.")}${feature("▤", "Smart Materials", "Get climate-suitable construction materials with practical recommendations.")}${feature("₹", "Cost Estimate", "Understand construction cost ranges before making major decisions.")}</div></div></section>
<section id="how" class="bg-[#f6f7f2] px-6 py-24"><div class="mx-auto max-w-7xl"><div class="text-center"><div class="text-xs font-bold uppercase tracking-[0.25em] text-[#708077]">How it works</div><h2 class="mt-4 text-4xl font-bold tracking-tight">One platform. Complete journey.</h2></div><div class="mt-14 grid gap-6 md:grid-cols-4">${step("01", "Upload Land", "Upload your land image and enter basic site information.")}${step("02", "AI Analysis", "BhoomiAI understands plot conditions, climate and orientation.")}${step("03", "Generate Home", "Create floor plans, materials and a complete architectural concept.")}${step("04", "Explore in 3D", "Walk through your future home before construction begins.")}</div></div></section>
${dashboardPreview()}<section id="about" class="px-6 py-24"><div class="mx-auto max-w-5xl text-center"><div class="text-xs font-bold uppercase tracking-[0.25em] text-[#718078]">Built for better decisions</div><h2 class="mt-4 text-4xl font-bold md:text-5xl">Design with intelligence,<span class="text-[#4d795b]"> not guesswork.</span></h2><p class="mx-auto mt-6 max-w-2xl leading-8 text-[#68766e]">BhoomiAI brings architectural thinking, environmental data and modern AI together so homeowners can make better decisions before construction begins.</p><button onclick="openSignup()" class="mt-8 rounded-full bg-[#163d2b] px-7 py-4 text-sm font-bold text-white">Start your project →</button></div></section><footer class="border-t border-[#dce3db] bg-[#f0f2ed] px-6 py-10"><div class="mx-auto flex max-w-7xl flex-col justify-between gap-5 md:flex-row md:items-center"><div><div class="font-bold">BhoomiAI</div><div class="mt-1 text-sm text-[#718078]">From land to home, intelligently.</div></div><div class="text-sm text-[#718078]">© 2026 BhoomiAI. Built for intelligent living.</div></div></footer></main>`;
      }

      function dashboardPreview() {
        return `<section id="solutions" class="bg-[#eef1eb] px-6 py-24"><div class="mx-auto max-w-7xl"><div class="mb-10 flex items-end justify-between gap-6"><div><div class="text-xs font-bold uppercase tracking-[0.25em] text-[#718078]">Your workspace</div><h2 class="mt-3 text-4xl font-bold">Everything in one dashboard.</h2></div><button onclick="openSignup()" class="hidden rounded-full bg-[#163d2b] px-5 py-3 text-sm font-bold text-white md:block">Open Dashboard →</button></div><div class="overflow-hidden rounded-[28px] border border-[#d4ddd3] bg-white shadow-xl"><div class="grid lg:grid-cols-[220px_1fr]"><div class="border-b border-[#e0e5df] bg-[#f8faf7] p-4 lg:border-b-0 lg:border-r"><div class="mb-7 flex items-center gap-2 px-2"><div class="flex h-8 w-8 items-center justify-center rounded-lg bg-[#163d2b] text-white">◈</div><span class="font-bold">BhoomiAI</span></div><div class="space-y-1">${["Overview", "Land Analysis", "Climate", "Floor Plan", "3D House", "Materials", "Cost Estimate"].map((x, i) => `<div class="rounded-xl px-3 py-2.5 text-sm ${i === 0 ? "bg-[#e0ebdf] font-semibold text-[#245039]" : "text-[#68766e]"}">${x}</div>`).join("")}</div></div><div class="p-6 lg:p-8"><div class="flex items-center justify-between"><div><div class="text-2xl font-bold">Good morning 👋</div><div class="mt-1 text-sm text-[#77847d]">Here is your project overview.</div></div><button onclick="openSignup()" class="rounded-xl bg-[#163d2b] px-4 py-2.5 text-sm font-bold text-white">+ New Project</button></div><div class="mt-7 grid gap-4 sm:grid-cols-2 xl:grid-cols-4">${dashPreview("Land Area", "2,400", "sq.ft")}${dashPreview("Climate", "28°", "C")}${dashPreview("Sustainability", "87", "/100")}${dashPreview("Design Progress", "62", "%")}</div><div class="mt-6 grid gap-5 lg:grid-cols-2"><div class="rounded-2xl border border-[#e2e7e1] p-5"><div class="flex items-center justify-between"><div class="font-bold">Floor Plan</div><div class="text-xs text-[#708078]">Ground Floor</div></div><div class="mt-5 h-52 rounded-xl bg-[#f1f3ef] p-5"><div class="grid h-full grid-cols-4 grid-rows-3 gap-2"><div class="col-span-2 row-span-2 rounded-md border-2 border-[#98aa9d] bg-white"></div><div class="rounded-md border-2 border-[#98aa9d] bg-white"></div><div class="rounded-md border-2 border-[#98aa9d] bg-white"></div><div class="rounded-md border-2 border-[#98aa9d] bg-white"></div><div class="col-span-2 rounded-md border-2 border-[#98aa9d] bg-white"></div><div class="rounded-md border-2 border-[#98aa9d] bg-white"></div></div></div></div><div class="rounded-2xl border border-[#e2e7e1] p-5"><div class="font-bold">3D House</div><div class="mt-5 flex h-52 items-center justify-center overflow-hidden rounded-xl bg-[#dfe8dc]"><div class="relative mt-8 h-28 w-44 bg-[#f2eee5] shadow-xl"><div class="absolute -top-16 left-[-15px] h-0 w-0 border-l-[100px] border-r-[100px] border-b-[75px] border-l-transparent border-r-transparent border-b-[#79947d]"></div><div class="absolute left-7 top-10 h-9 w-7 bg-[#7697a5]"></div><div class="absolute right-7 top-10 h-9 w-7 bg-[#7697a5]"></div><div class="absolute bottom-0 left-1/2 h-14 w-9 -translate-x-1/2 bg-[#795d48]"></div></div></div></div></div></div></div></div></section>`;
      }

      function dashboard() {
        const items = [
          "Overview",
          "My Projects",
          "Land Analysis",
          "House Designs",
          "3D Studio",
          "Materials",
          "Cost Estimate",
          "Profile",
        ];

      function auth() {
        return `<div class="fixed inset-0 z-50 flex items-center justify-center bg-[#10271c]/60 p-4 backdrop-blur-sm"><div class="relative max-h-[92vh] w-full max-w-md overflow-y-auto rounded-3xl bg-white p-6 shadow-2xl md:p-8"><button onclick="state.showAuth=false;render()" class="absolute right-5 top-5 flex h-9 w-9 items-center justify-center rounded-full bg-[#f0f3ee] text-[#65736b]">×</button><div class="pr-10"><div class="flex items-center gap-3"><div class="flex h-11 w-11 items-center justify-center rounded-xl bg-[#163d2b] text-white">◈</div><div><div class="font-bold">BhoomiAI</div><div class="text-[9px] uppercase tracking-[0.2em] text-[#7b877f]">Land to Home</div></div></div><h2 class="mt-7 text-2xl font-bold">${state.authMode === "login" ? "Welcome back" : "Create your BhoomiAI account"}</h2><p class="mt-2 text-sm text-[#758179]">${state.authMode === "login" ? "Continue your home design journey." : "Choose your account type to get started."}</p></div><div class="mt-6 grid grid-cols-2 rounded-xl bg-[#f1f4ef] p-1"><button onclick="state.authMode='login';render()" class="rounded-lg py-2.5 text-sm font-semibold ${state.authMode === "login" ? "bg-white text-[#163d2b] shadow-sm" : "text-[#758179]"}">Login</button><button onclick="state.authMode='signup';render()" class="rounded-lg py-2.5 text-sm font-semibold ${state.authMode === "signup" ? "bg-white text-[#163d2b] shadow-sm" : "text-[#758179]"}">Sign Up</button></div><form onsubmit="authSubmit(event)" class="mt-6">${state.authMode === "signup" ? `<div class="mb-5 text-xs font-bold uppercase tracking-[0.15em] text-[#7b877f]">Account type</div><div class="grid grid-cols-2 gap-3"><button type="button" onclick="state.role='consumer';render()" class="rounded-2xl border p-4 text-left ${state.role === "consumer" ? "border-[#7d9a82] bg-[#edf3eb]" : "border-[#dce3da]"}"><div class="text-lg">⌂</div><div class="mt-2 text-sm font-bold">Consumer</div><div class="mt-1 text-xs text-[#7b877f]">Design your home</div></button><button type="button" onclick="state.role='seller';render()" class="rounded-2xl border p-4 text-left ${state.role === "seller" ? "border-[#7d9a82] bg-[#edf3eb]" : "border-[#dce3da]"}"><div class="text-lg">◇</div><div class="mt-2 text-sm font-bold">Seller</div><div class="mt-1 text-xs text-[#7b877f]">Offer products/services</div></button></div><div class="mt-5">${input("Full Name", "name", "text", "Your name")}</div><div class="mt-4">${input("Contact Number", "contact", "text", "+91 XXXXX XXXXX")}</div><div class="mt-4">${input("Location", "location", "text", "City, State")}</div>${state.role === "seller" ? `<div class="mt-4">${input("Experience", "experience", "text", "e.g. 8 years")}</div>` : ""}` : ""}<div class="${state.authMode === "signup" ? "mt-4" : ""}">${input("Email", "email", "email", "you@example.com")}</div><div class="mt-4">${input("Password", "password", "password", "••••••••")}</div>${state.authError ? `<div role="alert" class="mt-4 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">${esc(state.authError)}</div>` : ""}<button type="submit" class="mt-6 w-full rounded-xl bg-[#163d2b] px-5 py-3.5 text-sm font-bold text-white">${state.authMode === "login" ? "Login to BhoomiAI →" : `Create ${state.role === "consumer" ? "Consumer" : "Seller"} Account →`}</button><div class="mt-5 text-center text-xs text-[#7b877f]">Frontend demo — backend authentication will be connected later.</div></form></div></div>`;
      }

      function nav(x) {
        state.active = x;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function render() {
        let html =
          state.screen === "landing"
            ? landing()
            : state.screen === "dashboard"
              ? dashboard()
              : seller();
        app.innerHTML = html + (state.showAuth ? auth() : "");
      }
      render();
    </script>
  </body>
</html>
